<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the notch area is ours, not a white bar. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0908" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      THE LINK PREVIEW.
      When she sends this on WhatsApp, this is the card he sees. It says
      nothing on purpose — a preview reading "Happy Birthday" would spoil
      the entire thing before he even taps.
    -->
    <title>open this. 👀</title>
    <meta name="description" content=" " />
    <meta property="og:title" content="open this. 👀" />
    <meta property="og:description" content=" " />
    <meta property="og:image" content="/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Keeps it out of Google, in case the URL ever leaks. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=Caveat:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: sans-serif; color: #f4efe6">
        This one needs JavaScript switched on. Sorry — there was no way to do
        it otherwise. 🙈
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
